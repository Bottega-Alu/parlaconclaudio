[tool.poetry]
name = "parlaconclaudio"
version = "1.0.18"
description = "Voice bridge for Claude Code: push-to-talk STT + TTS notifications"
authors = ["Fra"]
license = "MIT"
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# Audio capture
numpy = "^1.26.0"
pyaudio = "^0.2.14"

# Hotkey & clipboard
pynput = "^1.7.6"
pyperclip = "^1.8.2"

# System tray
pystray = "^0.19.5"
Pillow = "^10.0.0"

# STT engine
faster-whisper = "^1.0.0"
ctranslate2 = "^4.0.0"

# GPU (CUDA) - installed ONLY for the "gpu" profile, see src/core/gpu_probe.py.
# ctranslate2 does NOT declare these itself but cannot run on CUDA without them:
# its bundled cudnn64_9.dll is a 0.3 MB dispatcher stub, the real kernels live here.
# torch was dropped (4.25 GB) - it was imported solely for a device check that
# ctranslate2.get_cuda_device_count() + nvidia-smi answer natively.
nvidia-cublas-cu12 = {version = "^12.9", optional = true}
nvidia-cudnn-cu12 = {version = "^9.20", optional = true}

# Windows paste simulation
pywin32 = {version = "^306", markers = "sys_platform == 'win32'"}

# TTS (for notify-tts.py hook)
edge-tts = ">=7.3.1"

[tool.poetry.extras]
# poetry install -E gpu   -> local RTX path (adds ~1.6 GB of CUDA kernels)
# poetry install          -> CPU / cloud-only path
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

# Builds VoiceBridge.exe launcher stub (scripts/build_exe.ps1)
pyinstaller = "^6.22"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# Capture at the Python level, not by swapping file descriptors 0-2: Tcl builds its
# standard channels from those handles when a Tk() starts, and with fd capture an
# interpreter intermittently failed to start ("Can't find a usable init.tcl/tk.tcl",
# "invalid command name tcl_findLibrary"). Measured: fd capture failed most full runs,
# --capture=sys 0 of 8 full runs and 0 of 20 UI-only runs.
addopts = "--capture=sys"
