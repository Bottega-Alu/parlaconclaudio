name: Bug report
description: Help us reproduce a problem with the app.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting this. Please remove API keys, personal transcripts and private information from screenshots and logs. English, Italiano and Português are welcome."
  - type: input
    id: version
    attributes:
      label: App version
      description: Find it in the app window or About page.
      placeholder: "1.0.19"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and recognition engine
      placeholder: "Windows 11; Automatic / Local GPU / Groq / Deepgram"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Choose…\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Add redacted screenshots or a short recording if useful.
    validations:
      required: true
